baseURL = "https://blog.zjackie.ink/"
title = "0x1 ZeroINK"
theme = "PaperMod"

locale = "en-us"
defaultContentLanguage = "en"
hasCJKLanguage = true

copyright = "Copyright &copy; 2026 Jackie"

enableEmoji = true
enableGitInfo = true

[pagination]
  pagerSize = 10

[permalinks]
  posts = "/posts/:slug/"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "archives"
    name = "Archives"
    url = "/archives/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 40

[params]
  env = "production"
  description = "Jackie's personal blog"
  author = "Jackie"

  defaultTheme = "auto"
  disableThemeToggle = false

  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true

  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "Hi there 👋"
    Content = "Welcome to ZeroINK — Jackie's personal blog."

  [params.editPost]
    URL = "https://github.com/PyXMR2025/0x1-ZeroINK/edit/main/content"
    Text = "Suggest Changes"
    appendFilePath = true

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/PyXMR2025/0x1-ZeroINK"

  [[params.socialIcons]]
    name = "rss"
    url = "https://blog.zjackie.ink/index.xml"

[markup]
  [markup.highlight]
    anchorLineNos = true
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true

[taxonomies]
  tag = "tags"
  category = "categories"
