name: Purge Cache & Push IndexNow

on:
  workflow_run:
    workflows: ["Deploy"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: post-deploy-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  wait-for-pages:
    name: Wait for gh-pages build
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve deployed commit
        id: resolve
        shell: bash
        run: |
          sha='${{ github.event.workflow_run.head_sha }}'
          [ -z "$sha" ] && sha='${{ github.sha }}'
          # Pages builds the gh-pages deploy commit, not this SHA, so the match
          # below is time-based: wait for a Pages build finished AFTER Deploy did.
          baseline='${{ github.event.workflow_run.updated_at }}'
          [ -z "$baseline" ] && baseline=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "Deployed commit: $sha (deploy finished at $baseline)"

      - name: Poll GitHub Pages build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASELINE: ${{ steps.resolve.outputs.baseline }}
        run: |
          baseline_ts=$(( $(date -u -d "$BASELINE" +%s) - 60 ))   # small clock-skew tolerance
          deadline=$((SECONDS + 600))   # 10 min timeout
          while true; do
            if build=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '{status, updated_at}' 2>/dev/null); then
              status=$(jq -r '.status' <<< "$build")
              updated_at=$(jq -r '.updated_at' <<< "$build")
              updated_ts=$(date -u -d "$updated_at" +%s)
              echo "Pages build: status=$status updated_at=$updated_at (baseline $BASELINE)"
              if [ "$status" = "built" ] && [ "$updated_ts" -ge "$baseline_ts" ]; then
                echo "gh-pages build finished."
                exit 0
              fi
            else
              echo "::warning::Pages builds API unavailable, falling back to a fixed wait."
              sleep 60
              exit 0
            fi
            if [ $SECONDS -ge $deadline ]; then
              echo "::warning::Timed out waiting for the Pages build, continuing anyway."
              exit 0
            fi
            sleep 15
          done

  purge-cache:
    name: Purge Cloudflare cache
    needs: wait-for-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.wait-for-pages.outputs.sha }}
          submodules: true
          fetch-depth: 2

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build site
        run: hugo --gc --minify --cleanDestinationDir

      - name: Purge Cloudflare cache
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          BASE_URL: https://blog.zjackie.ink
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ZONE_ID not set, skipping cache purge."
            exit 0
          fi

          urls=()

          # 1. All HTML files from the build output
          while IFS= read -r -d '' f; do
            path="${f#public/}"
            urls+=("$BASE_URL/$path")
            # Also purge the pretty directory URL for index.html pages
            if [ "$path" = "index.html" ]; then
              urls+=("$BASE_URL/")
            elif [[ "$path" == */index.html ]]; then
              urls+=("$BASE_URL/${path%/index.html}/")
            fi
          done < <(find public -type f -name '*.html' -print0)

          # 2. Files changed in the deployed commit (map repo paths to site URLs)
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              rel="$f"
              [[ "$rel" == static/* ]] && rel="${rel#static/}"
              if [ -f "public/$rel" ]; then
                urls+=("$BASE_URL/$rel")
              fi
            done < <(git diff --name-only HEAD^ HEAD || true)
          fi

          # De-duplicate
          mapfile -t urls < <(printf '%s\n' "${urls[@]}" | sort -u)
          echo "Purging ${#urls[@]} URLs"

          # Purge in batches of 30 (Cloudflare API limit per request)
          for ((i = 0; i < ${#urls[@]}; i += 30)); do
            batch=("${urls[@]:i:30}")
            json=$(printf '%s\n' "${batch[@]}" | jq -R . | jq -cs '{files: .}')
            response=$(curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$json")
            if [ "$(jq -r '.success' <<< "$response")" != "true" ]; then
              echo "::error::Cloudflare cache purge failed: $response"
              exit 1
            fi
            echo "Purged batch $((i / 30 + 1)): ${#batch[@]} URLs"
          done

  indexnow:
    name: Submit sitemap URLs to IndexNow
    needs: wait-for-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.wait-for-pages.outputs.sha }}
          fetch-depth: 2

      - name: Detect content changes
        id: changes
        shell: bash
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            changed=$(git diff --name-only HEAD^ HEAD -- 'content/**' || true)
          else
            changed="content/**"
          fi
          if [ -z "$changed" ]; then
            echo "No content changes in the deployed commit, skipping IndexNow."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Content changes detected:"
            echo "$changed"
          fi

      - name: Fetch sitemap and build URL list
        id: urls
        if: steps.changes.outputs.skip != 'true'
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            SITEMAP=$(curl -fsS "https://blog.zjackie.ink/sitemap.xml") && break
            echo "Fetch failed (attempt $i), retrying in 20s..."
            sleep 20
          done

          if [ -z "$SITEMAP" ]; then
            echo "::error::Could not fetch sitemap.xml"
            exit 1
          fi

          LIST=$(echo "$SITEMAP" | grep -oP '(?<=<loc>)[^<]+' | grep -v '/404' | jq -R . | jq -sc .)

          if [ "$LIST" = "[]" ]; then
            echo "::error::No URLs found in sitemap.xml"
            exit 1
          fi

          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "$LIST" | jq -r '.[]' | while read -r u; do echo "Queued: $u"; done

      - name: Submit to IndexNow
        if: steps.changes.outputs.skip != 'true'
        env:
          INDEX_NOW_API_KEY: ${{ secrets.INDEX_NOW_API_KEY }}
          URL_LIST: ${{ steps.urls.outputs.list }}
        run: |
          if [ -z "$INDEX_NOW_API_KEY" ]; then
            echo "::error::Secret INDEX_NOW_API_KEY is empty. Set it in Settings → Secrets and variables → Actions (repository secrets, not environment secrets)."
            exit 1
          fi
          echo "Key length: ${#INDEX_NOW_API_KEY}"
          echo "URL count: $(jq length <<< "$URL_LIST")"

          jq -n \
            --arg host "blog.zjackie.ink" \
            --arg key "$INDEX_NOW_API_KEY" \
            --arg keyLocation "https://blog.zjackie.ink/${INDEX_NOW_API_KEY}.txt" \
            --argjson urlList "$URL_LIST" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}' > payload.json

          response=$(curl -sS -w "\n%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @payload.json)

          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "IndexNow response ($code): $body"

          case "$code" in
            200|202) echo "Submitted successfully." ;;
            *) echo "::error::IndexNow submission failed with HTTP $code"; exit 1 ;;
          esac
