name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build site
        run: hugo --gc --minify --cleanDestinationDir

      - name: Minify static JS/CSS
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          # Hugo already minifies rendered HTML/XML/JSON and every asset that
          # goes through its resource pipeline. Files copied verbatim from
          # static/ (e.g. sw.js) are left untouched, so minify them here.
          # Fingerprinted bundles are skipped: their SRI hashes are embedded
          # in the HTML and would break if their content changed.
          for f in public/**/*.js public/**/*.css; do
            if [[ "$f" =~ \.[0-9a-f]{32,}\.(js|css)$ ]]; then
              continue
            fi
            echo "Minifying $f"
            npx --yes esbuild@0.25.0 "$f" --minify --outfile="$f" --allow-overwrite
          done

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.sha }}"
          # Uncomment when the custom domain is configured in GitHub Pages:
          cname: blog.zjackie.ink
