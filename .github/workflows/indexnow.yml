name: IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  actions: read

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  submit:
    name: Submit sitemap URLs to IndexNow
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Deploy workflow to finish
        id: wait
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          deadline=$((SECONDS + 900))   # 15 min timeout
          while true; do
            read -r status conclusion < <(gh api \
              "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "Deploy")] | sort_by(.created_at) | last | "\(.status) \(.conclusion)"')

            echo "Deploy run for $SHA: status=$status conclusion=$conclusion"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Deploy succeeded, proceeding."
                exit 0
              else
                echo "::warning::Deploy finished with '$conclusion', skipping IndexNow submission."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            if [ $SECONDS -ge $deadline ]; then
              echo "::error::Timed out waiting for Deploy workflow."
              exit 1
            fi
            sleep 20
          done

      - name: Fetch sitemap and build URL list
        id: urls
        if: steps.wait.outputs.skip != 'true'
        shell: bash
        run: |
          for i in 1 2 3; do
            SITEMAP=$(curl -fsS "https://blog.zjackie.ink/sitemap.xml") && break
            echo "Fetch failed (attempt $i), retrying in 20s..."
            sleep 20
          done

          if [ -z "$SITEMAP" ]; then
            echo "::error::Could not fetch sitemap.xml"
            exit 1
          fi

          LIST=$(echo "$SITEMAP" | grep -oP '(?<=<loc>)[^<]+' | grep -v '/404' | jq -R . | jq -sc .)

          if [ "$LIST" = "[]" ]; then
            echo "::error::No URLs found in sitemap.xml"
            exit 1
          fi

          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "$LIST" | jq -r '.[]' | while read -r u; do echo "Queued: $u"; done

      - name: Submit to IndexNow
        if: steps.wait.outputs.skip != 'true'
        env:
          INDEX_NOW_API_KEY: ${{ secrets.INDEX_NOW_API_KEY }}
          URL_LIST: ${{ steps.urls.outputs.list }}
        run: |
          if [ -z "$INDEX_NOW_API_KEY" ]; then
            echo "::error::Secret INDEX_NOW_API_KEY is empty. Set it in Settings → Secrets and variables → Actions (repository secrets, not environment secrets)."
            exit 1
          fi
          echo "Key length: ${#INDEX_NOW_API_KEY}"
          echo "URL count: $(jq length <<< "$URL_LIST")"

          jq -n \
            --arg host "blog.zjackie.ink" \
            --arg key "$INDEX_NOW_API_KEY" \
            --arg keyLocation "https://blog.zjackie.ink/${INDEX_NOW_API_KEY}.txt" \
            --argjson urlList "$URL_LIST" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}' > payload.json

          response=$(curl -sS -w "\n%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @payload.json)

          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "IndexNow response ($code): $body"

          case "$code" in
            200|202) echo "Submitted successfully." ;;
            *) echo "::error::IndexNow submission failed with HTTP $code"; exit 1 ;;
          esac
